<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפניה חדשה | מערכת הפניות</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap');
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --ink: #23292B; --ink-soft: #5B635F;
  --primary: #1F3A3D; --primary-light: #2E5256; --accent: #A8763E; --accent-soft: #F0E4D3;
  --border: #E2DED4; --success: #3F6B4F; --success-bg: #E7F0E9;
  --danger: #A23B33; --danger-bg: #F7E8E6; --warn: #92711F; --warn-bg: #F6EDD8; --radius: 6px;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Heebo',sans-serif; direction:rtl; font-size:15px; line-height:1.55; }
h1,h2,h3 { font-family:'Frank Ruhl Libre',serif; font-weight:700; color:var(--primary); margin:0 0 .4em 0; }
a { color: var(--primary); }
.layout { display:flex; min-height:100vh; }
.sidebar { width:230px; background:var(--primary); color:#EDEFEA; padding:24px 18px; flex-shrink:0; }
.sidebar .brand { font-family:'Frank Ruhl Libre',serif; font-size:1.2rem; margin-bottom:28px; color:#fff; }
.sidebar nav a { display:block; color:#C9D2CC; text-decoration:none; padding:10px 12px; border-radius:var(--radius); margin-bottom:4px; font-size:.95rem; cursor:pointer; }
.sidebar nav a:hover { background:rgba(255,255,255,.08); color:#fff; }
.sidebar nav a.active { background:var(--accent); color:#fff; }
.sidebar .user-info { margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.15); font-size:.85rem; color:#C9D2CC; }
.main { flex:1; padding:32px 40px; max-width:1100px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
.stat .num { font-family:'Frank Ruhl Libre',serif; font-size:1.9rem; color:var(--primary); }
.stat .label { color:var(--ink-soft); font-size:.85rem; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th,td { text-align:right; padding:10px 12px; border-bottom:1px solid var(--border); }
th { color:var(--ink-soft); font-weight:500; font-size:.82rem; }
tr:hover td { background:#FAFAF7; }
.btn { display:inline-block; background:var(--primary); color:#fff; border:none; padding:9px 18px; border-radius:var(--radius); font-family:'Heebo',sans-serif; font-size:.9rem; cursor:pointer; text-decoration:none; }
.btn:hover { background:var(--primary-light); }
.btn.secondary { background:transparent; color:var(--primary); border:1px solid var(--border); }
.btn.accent { background:var(--accent); }
.btn.danger { background:var(--danger); }
.btn.small { padding:5px 12px; font-size:.8rem; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; }
.badge.new,.badge.offered { background:var(--warn-bg); color:var(--warn); }
.badge.accepted,.badge.meeting_scheduled { background:var(--accent-soft); color:var(--accent); }
.badge.case_opened { background:#E3EAF0; color:var(--primary); }
.badge.fully_collected,.badge.active { background:var(--success-bg); color:var(--success); }
.badge.declined,.badge.sla_expired,.badge.not_realized,.badge.closed_no_payment,.badge.blocked { background:var(--danger-bg); color:var(--danger); }
.badge.offer_pending { background:var(--warn-bg); color:var(--warn); }
.badge.offer_accepted,.badge.offer_meeting_scheduled { background:var(--accent-soft); color:var(--accent); }
.badge.offer_case_opened { background:#E3EAF0; color:var(--primary); }
.badge.offer_declined,.badge.offer_not_realized,.badge.offer_closed_other_won { background:var(--danger-bg); color:var(--danger); }
label { display:block; font-size:.85rem; color:var(--ink-soft); margin:12px 0 4px; }
input,select,textarea { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius); font-family:'Heebo',sans-serif; font-size:.9rem; background:#fff; color:var(--ink); }
textarea { min-height:90px; resize:vertical; }
.auth-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.auth-box { width:380px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:34px 30px; }
.auth-box .brand { font-family:'Frank Ruhl Libre',serif; font-size:1.3rem; color:var(--primary); margin-bottom:4px; }
.muted { color:var(--ink-soft); font-size:.85rem; }
.error-msg { color:var(--danger); font-size:.85rem; margin-top:8px; }
.success-msg { color:var(--success); font-size:.85rem; margin-top:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:.82rem; cursor:pointer; user-select:none; }
.chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal { background:#fff; border-radius:var(--radius); padding:26px; width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; }
.empty-state { text-align:center; padding:40px 20px; color:var(--ink-soft); }
.config-banner { background:var(--warn-bg); color:var(--warn); padding:10px 16px; font-size:.85rem; text-align:center; }
</style>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box" id="box" style="width:460px;"><p class="muted">טוען...</p></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
/* ======================================================================
   הגדרות - יש להחליף את הערכים כאן בערכים מפרויקט ה-Firebase שלך
   (איך משיגים אותם - ראה SETUP_GUIDE.md)
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDd8rcBAPysNvsGsydUhB5AXnqIw_RwU14",
  authDomain: "stp-lids.firebaseapp.com",
  projectId: "stp-lids",
  storageBucket: "stp-lids.firebasestorage.app",
  messagingSenderId: "885779964489",
  appId: "1:885779964489:web:cc8dd3ceed61093b711598",
};

// EmailJS - לשליחת מיילים אמיתיים (הודעה על הפניה חדשה). ראה SETUP_GUIDE.md
const EMAILJS_PUBLIC_KEY = "PASTE_EMAILJS_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "PASTE_EMAILJS_SERVICE_ID";
const EMAILJS_TEMPLATE_NEW_LEAD = "PASTE_EMAILJS_TEMPLATE_ID"; // תבנית עם משתנים: to_email, lawyer_name, practice_area, region, response_link
const EMAILJS_TEMPLATE_FREE_MSG = "PASTE_EMAILJS_FREE_TEMPLATE_ID"; // תבנית שנייה (אופציונלי) למייל חופשי מהמערכת - משתנים: to_email, lawyer_name, subject, message

// כתובת הבסיס של האתר שבו מתארחים דפי המערכת (ללא / בסוף) - לבניית קישורים בתוך מיילים
const APP_BASE_URL = "https://cheery-gecko-42a573.netlify.app"; // לדוגמה: https://leads.yourfirm.co.il

/* ====================================================================== */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

if (typeof emailjs !== "undefined" && EMAILJS_PUBLIC_KEY && !EMAILJS_PUBLIC_KEY.startsWith("PASTE_")) {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

function isConfigured() {
  return !firebaseConfig.apiKey.startsWith("PASTE_");
}

function showConfigWarningIfNeeded() {
  if (!isConfigured()) {
    const banner = document.createElement("div");
    banner.className = "config-banner";
    banner.textContent = "⚠ המערכת עדיין לא מחוברת ל-Firebase - יש להשלים את ההגדרות בראש הקובץ (ראו SETUP_GUIDE.md)";
    document.body.prepend(banner);
  }
}

const STATUS_LABELS = {
  new: "ליד חדש", offered: "הופץ - ממתין לתגובה", accepted: "התקבל - ממתין לדיווח",
  declined: "נדחה", sla_expired: "פג תוקף התגובה", meeting_scheduled: "נקבעה פגישה",
  case_opened: "נפתח תיק", not_realized: "לא התממש", not_collected: "טרם נגבה",
  partially_collected: "נגבה חלקית", fully_collected: "נגבה במלואו", closed_no_payment: "נסגר ללא גבייה",
  active: "פעיל", inactive: "לא פעיל", pending: "ממתין לאישור", blocked: "חסום",
  offer_pending: "ממתין לתגובה", offer_accepted: "אישר/ה קבלה", offer_declined: "דחה/תה",
  offer_meeting_scheduled: "נקבעה פגישה", offer_case_opened: "נפתח תיק",
  offer_not_realized: "לא התממש", offer_closed_other_won: "נסגר - טופל ע\"י עו\"ד אחר",
};
function statusLabel(s) { return STATUS_LABELS[s] || s; }

function fmtDate(ts) {
  if (!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("he-IL");
}

async function isAdminUser(user) {
  if (!user || !user.email) return false;
  const doc = await db.collection("admins").doc(user.email).get();
  return doc.exists;
}

async function getLawyerDoc(user) {
  if (!user || !user.email) return null;
  const doc = await db.collection("lawyers").doc(user.email).get();
  return doc.exists ? { id: doc.id, ...doc.data() } : null;
}

// שומר על עמוד מנהל - מפנה להתחברות אם לא מחובר/לא מנהל
function requireAdmin(onReady) {
  auth.onAuthStateChanged(async (user) => {
    if (!user) return (window.location.href = "admin-login.html");
    const ok = await isAdminUser(user);
    if (!ok) {
      alert("המשתמש המחובר אינו מוגדר כמנהל במערכת.");
      await auth.signOut();
      return (window.location.href = "admin-login.html");
    }
    onReady(user);
  });
}

// שומר על עמוד עו"ד - מפנה להתחברות אם לא מחובר/לא רשום/לא פעיל
function requireLawyer(onReady) {
  auth.onAuthStateChanged(async (user) => {
    if (!user) return (window.location.href = "lawyer-login.html");
    const lawyer = await getLawyerDoc(user);
    if (!lawyer || lawyer.status !== "active") {
      alert("חשבון זה אינו רשום/פעיל כעורך דין שותף במערכת.");
      await auth.signOut();
      return (window.location.href = "lawyer-login.html");
    }
    onReady(user, lawyer);
  });
}

function logout(redirectTo) {
  auth.signOut().then(() => (window.location.href = redirectTo));
}

function newId() {
  return db.collection("_").doc().id; // דרך פשוטה לקבל מזהה רנדומלי חזק מ-Firestore
}
// הופך טקסט למוצג בבטחה (מגן מפני הזרקת קוד) - חובה על כל טקסט שמקורו בנתונים
function esc(val) {
  if (val === null || val === undefined) return "";
  return String(val).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

showConfigWarningIfNeeded();
const box = document.getElementById("box");
const token = new URLSearchParams(window.location.search).get("token");

function render(t) {
  if (t.decision === "offer_accepted") {
    box.innerHTML = `<div class="brand">כבר אישרת קבלת הפניה זו</div><p class="muted">פרטי הלקוח המלאים זמינים באזור האישי שלך.</p>
      <a class="btn" href="lawyer-login.html" style="margin-top:14px; display:inline-block;">כניסה לאזור האישי</a>`;
    return;
  }
  if (t.decision === "offer_declined") {
    box.innerHTML = `<div class="brand">כבר דחית הפניה זו</div><p class="muted">אם זו טעות, נא ליצור קשר עם המשרד שהפנה אליך את ההפניה.</p>`;
    return;
  }

  box.innerHTML = `
    <div class="brand">הפניה חדשה עבורך</div>
    <p class="muted">תחום עיסוק: <b>${esc(t.practiceArea)}</b>${t.region ? " · אזור: " + esc(t.region) : ""}</p>
    <div class="card" style="margin:16px 0;">
      <div class="muted" style="margin-bottom:6px;">תיאור המקרה (ללא פרטי לקוח מזהים):</div>
      <div>${esc(t.caseDescription) || "לא סופק תיאור נוסף"}</div>
    </div>
    <p class="muted">פרטי הלקוח המלאים יועברו אליך באזור האישי רק לאחר שתאשר/י קבלת ההפניה. שים לב: ייתכן שההפניה נשלחה גם לעורך/ת דין נוסף/ת במקביל - מי שיאשר/י ראשון/ה יקבל/תקבל את הטיפול בתיק.</p>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn" id="acceptBtn" style="flex:1;">מעוניין/ת לקבל</button>
      <button class="btn secondary" id="declineBtn" style="flex:1;">דחה</button>
    </div>
    <div class="error-msg" id="err"></div>`;
  document.getElementById("acceptBtn").addEventListener("click", () => respond("offer_accepted"));
  document.getElementById("declineBtn").addEventListener("click", () => respond("offer_declined"));
}

async function respond(decision) {
  try {
    const ref = db.collection("responseTokens").doc(token);
    await ref.update({ decision, decidedAt: firebase.firestore.FieldValue.serverTimestamp() });
    // שימו לב: ההחלטה נרשמת כאן בלבד. היא "נקלטת" בפועל במערכת (ומוצגת למנהל/לעו"ד) ברגע
    // שהמנהל או אותו עו"ד עצמו נכנסים למערכת בפעם הבאה - אין שרת רקע, ראו SETUP_GUIDE.
    if (decision === "offer_accepted") {
      box.innerHTML = `<div class="brand">תודה!</div><p>התשובה שלך נקלטה. פרטי הלקוח המלאים יופיעו באזור האישי שלך לאחר שהמשרד יאשר את הקבלה במערכת (לרוב באותו יום).</p>
        <a class="btn" href="lawyer-login.html" style="margin-top:14px; display:inline-block;">כניסה לאזור האישי</a>`;
    } else {
      box.innerHTML = `<div class="brand">תודה על התגובה</div><p class="muted">ההפניה סומנה כנדחתה.</p>`;
    }
  } catch (ex) {
    const errEl = document.getElementById("err");
    if (errEl) errEl.textContent = "שגיאה: " + ex.message; else alert("שגיאה: " + ex.message);
  }
}

async function load() {
  if (!token) { box.innerHTML = '<div class="brand">קישור לא תקין</div>'; return; }
  try {
    await auth.signInAnonymously();
    const doc = await db.collection("responseTokens").doc(token).get();
    if (!doc.exists) { box.innerHTML = '<div class="brand">קישור לא תקין או שפג תוקפו</div>'; return; }
    const t = doc.data();

    if (!t.viewedAt) {
      db.collection("responseTokens").doc(token).update({ viewedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
    }

    render(t);
  } catch (ex) {
    box.innerHTML = `<div class="brand">שגיאה בטעינת ההפניה</div><p class="error-msg">${esc(ex.message)}</p>`;
  }
}
load();
  </script>
</body>
</html>
