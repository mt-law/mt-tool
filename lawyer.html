<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap');
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --ink: #23292B; --ink-soft: #5B635F;
  --primary: #1F3A3D; --primary-light: #2E5256; --accent: #A8763E; --accent-soft: #F0E4D3;
  --border: #E2DED4; --success: #3F6B4F; --success-bg: #E7F0E9;
  --danger: #A23B33; --danger-bg: #F7E8E6; --warn: #92711F; --warn-bg: #F6EDD8; --radius: 6px;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:'Heebo',sans-serif; direction:rtl; font-size:15px; line-height:1.55; }
h1,h2,h3 { font-family:'Frank Ruhl Libre',serif; font-weight:700; color:var(--primary); margin:0 0 .4em 0; }
a { color: var(--primary); }
.layout { display:flex; min-height:100vh; }
.sidebar { width:230px; background:var(--primary); color:#EDEFEA; padding:24px 18px; flex-shrink:0; }
.sidebar .brand { font-family:'Frank Ruhl Libre',serif; font-size:1.2rem; margin-bottom:28px; color:#fff; }
.sidebar nav a { display:block; color:#C9D2CC; text-decoration:none; padding:10px 12px; border-radius:var(--radius); margin-bottom:4px; font-size:.95rem; cursor:pointer; }
.sidebar nav a:hover { background:rgba(255,255,255,.08); color:#fff; }
.sidebar nav a.active { background:var(--accent); color:#fff; }
.sidebar .user-info { margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.15); font-size:.85rem; color:#C9D2CC; }
.main { flex:1; padding:32px 40px; max-width:1100px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
.stat .num { font-family:'Frank Ruhl Libre',serif; font-size:1.9rem; color:var(--primary); }
.stat .label { color:var(--ink-soft); font-size:.85rem; }
table { width:100%; border-collapse:collapse; font-size:.9rem; }
th,td { text-align:right; padding:10px 12px; border-bottom:1px solid var(--border); }
th { color:var(--ink-soft); font-weight:500; font-size:.82rem; }
tr:hover td { background:#FAFAF7; }
.btn { display:inline-block; background:var(--primary); color:#fff; border:none; padding:9px 18px; border-radius:var(--radius); font-family:'Heebo',sans-serif; font-size:.9rem; cursor:pointer; text-decoration:none; }
.btn:hover { background:var(--primary-light); }
.btn.secondary { background:transparent; color:var(--primary); border:1px solid var(--border); }
.btn.accent { background:var(--accent); }
.btn.danger { background:var(--danger); }
.btn.small { padding:5px 12px; font-size:.8rem; }
.badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; }
.badge.new,.badge.offered { background:var(--warn-bg); color:var(--warn); }
.badge.accepted,.badge.meeting_scheduled { background:var(--accent-soft); color:var(--accent); }
.badge.case_opened { background:#E3EAF0; color:var(--primary); }
.badge.fully_collected,.badge.active { background:var(--success-bg); color:var(--success); }
.badge.declined,.badge.sla_expired,.badge.not_realized,.badge.closed_no_payment,.badge.blocked { background:var(--danger-bg); color:var(--danger); }
.badge.offer_pending { background:var(--warn-bg); color:var(--warn); }
.badge.offer_accepted,.badge.offer_meeting_scheduled { background:var(--accent-soft); color:var(--accent); }
.badge.offer_case_opened { background:#E3EAF0; color:var(--primary); }
.badge.offer_declined,.badge.offer_not_realized,.badge.offer_closed_other_won { background:var(--danger-bg); color:var(--danger); }
label { display:block; font-size:.85rem; color:var(--ink-soft); margin:12px 0 4px; }
input,select,textarea { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius); font-family:'Heebo',sans-serif; font-size:.9rem; background:#fff; color:var(--ink); }
textarea { min-height:90px; resize:vertical; }
.auth-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.auth-box { width:380px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:34px 30px; }
.auth-box .brand { font-family:'Frank Ruhl Libre',serif; font-size:1.3rem; color:var(--primary); margin-bottom:4px; }
.muted { color:var(--ink-soft); font-size:.85rem; }
.error-msg { color:var(--danger); font-size:.85rem; margin-top:8px; }
.success-msg { color:var(--success); font-size:.85rem; margin-top:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:.82rem; cursor:pointer; user-select:none; }
.chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
.toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal { background:#fff; border-radius:var(--radius); padding:26px; width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; }
.empty-state { text-align:center; padding:40px 20px; color:var(--ink-soft); }
.config-banner { background:var(--warn-bg); color:var(--warn); padding:10px 16px; font-size:.85rem; text-align:center; }
</style>
</head>

  <script>
/* ======================================================================
   הגדרות - יש להחליף את הערכים כאן בערכים מפרויקט ה-Firebase שלך

const ADMIN_CONTACT_EMAIL = "davidi@mt-law.co.il"; // כתובת המשרד - אליה נפתח מייל ב"יצירת קשר"

// כתובת הבסיס של האתר שבו מתארחים דפי המערכת (ללא / בסוף) - לבניית קישורים בתוך מיילים
const APP_BASE_URL = "https://cheery-gecko-42a573.netlify.app"; // לדוגמה: https://leads.yourfirm.co.il

/* ====================================================================== */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function isConfigured() {
  return !firebaseConfig.apiKey.startsWith("PASTE_");
}

function showConfigWarningIfNeeded() {
  if (!isConfigured()) {
    const banner = document.createElement("div");
    banner.className = "config-banner";
    banner.textContent = "⚠ המערכת עדיין לא מחוברת ל-Firebase - יש להשלים את ההגדרות בראש הקובץ (ראו SETUP_GUIDE.md)";
    document.body.prepend(banner);
  }
}

const STATUS_LABELS = {
  new: "ליד חדש", offered: "הופץ - ממתין לתגובה", accepted: "התקבל - ממתין לדיווח",
  declined: "נדחה", sla_expired: "פג תוקף התגובה", meeting_scheduled: "נקבעה פגישה",
  case_opened: "נפתח תיק", not_realized: "לא התממש", not_collected: "טרם נגבה",
  partially_collected: "נגבה חלקית", fully_collected: "נגבה במלואו", closed_no_payment: "נסגר ללא גבייה",
  active: "פעיל", inactive: "לא פעיל", pending: "ממתין לאישור", blocked: "חסום",
  offer_pending: "ממתין לתגובה", offer_accepted: "אישר/ה קבלה", offer_declined: "דחה/תה",
  offer_meeting_scheduled: "נקבעה פגישה", offer_case_opened: "נפתח תיק",
  offer_not_realized: "לא התממש", offer_closed_other_won: "נסגר - טופל ע\"י עו\"ד אחר",
};
function statusLabel(s) { return STATUS_LABELS[s] || s; }

function fmtDate(ts) {
  if (!ts) return "-";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("he-IL");
}

async function isAdminUser(user) {
  if (!user || !user.email) return false;
  const doc = await db.collection("admins").doc(user.email).get();
  return doc.exists;
}

async function getLawyerDoc(user) {
  if (!user || !user.email) return null;
  const doc = await db.collection("lawyers").doc(user.email).get();
  return doc.exists ? { id: doc.id, ...doc.data() } : null;
}

// שומר על עמוד מנהל - מפנה להתחברות אם לא מחובר/לא מנהל
function requireAdmin(onReady) {
  auth.onAuthStateChanged(async (user) => {
    if (!user) return (window.location.href = "admin-login.html");
    const ok = await isAdminUser(user);
    if (!ok) {
      alert("המשתמש המחובר אינו מוגדר כמנהל במערכת.");
      await auth.signOut();
      return (window.location.href = "admin-login.html");
    }
    onReady(user);
  });
}

// שומר על עמוד עו"ד - מפנה להתחברות אם לא מחובר/לא רשום/לא פעיל
function requireLawyer(onReady) {
  auth.onAuthStateChanged(async (user) => {
    if (!user) return (window.location.href = "lawyer-login.html");
    const lawyer = await getLawyerDoc(user);
    if (!lawyer || lawyer.status !== "active") {
      alert("חשבון זה אינו רשום/פעיל כעורך דין שותף במערכת.");
      await auth.signOut();
      return (window.location.href = "lawyer-login.html");
    }
    onReady(user, lawyer);
  });
}

function logout(redirectTo) {
  auth.signOut().then(() => (window.location.href = redirectTo));
}

function newId() {
  return db.collection("_").doc().id; // דרך פשוטה לקבל מזהה רנדומלי חזק מ-Firestore
}

// הופך טקסט למוצג בבטחה (מגן מפני הזרקת קוד) - חובה על כל טקסט שמקורו בנתונים
function esc(val) {
  if (val === null || val === undefined) return "";
  return String(val).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

showConfigWarningIfNeeded();
const mainEl = document.getElementById("main");
const modalRoot = document.getElementById("modalRoot");
let currentLawyer = null;

document.getElementById("nav").addEventListener("click", (e) => {
  const link = e.target.closest("a[data-view]");
  if (!link) return;
  document.querySelectorAll("#nav a").forEach((a) => a.classList.remove("active"));
  link.classList.add("active");
  render(link.dataset.view);
});
document.getElementById("logoutLink").addEventListener("click", () => logout("lawyer-login.html"));

function closeModal() { modalRoot.innerHTML = ""; }
function openModal(html) {
  modalRoot.innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal">${html}</div></div>`;
  document.getElementById("backdrop").addEventListener("click", (e) => { if (e.target.id === "backdrop") closeModal(); });
}

// כל עו"ד מתקדם בנפרד בשלבים - אין חסימה הדדית עד שלב פתיחת תיק בפועל
const NEXT_ACTION = {
  offer_accepted: { next: "offer_meeting_scheduled", label: "סמן: נקבעה פגישה" },
  offer_meeting_scheduled: { next: "offer_case_opened", label: "סמן: נפתח תיק" },
};

function leadIsClosedByOther(lead) {
  return lead.status === "case_opened" && lead.assignedLawyerEmail !== currentLawyer.email;
}

// מיישב החלטות (אישור/דחייה) שהתקבלו דרך קישור המענה הציבורי (responseTokens) לתוך ההצעה האמיתית
// במערכת - מתבצע בכל כניסה לאזור "ההפניות שלי" (אין שרת רקע, ראו SETUP_GUIDE)
async function reconcileMyResponseTokens() {
  const tokensSnap = await db.collection("responseTokens").where("lawyerEmail", "==", currentLawyer.email).get();
  for (const tokenDoc of tokensSnap.docs) {
    const t = tokenDoc.data();
    if (!t.decision || !t.leadId) continue;
    try {
      const offerRef = db.collection("leads").doc(t.leadId).collection("offers").doc(currentLawyer.email);
      const offerDoc = await offerRef.get();
      if (!offerDoc.exists || offerDoc.data().status !== "offer_pending") continue; // כבר יושב בעבר, או שאין הצעה כזו
      await offerRef.update({ status: t.decision, respondedAt: t.decidedAt || firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection("statusLogs").add({
        leadId: t.leadId, fromStatus: "offer_pending", toStatus: t.decision, actor: "lawyer", lawyerEmail: currentLawyer.email,
        at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      if (t.decision === "offer_declined") {
        const leadRef = db.collection("leads").doc(t.leadId);
        const [leadDoc, allOffersSnap] = await Promise.all([leadRef.get(), leadRef.collection("offers").get()]);
        const lead = leadDoc.data();
        const anyOpen = allOffersSnap.docs.some((d) => ["offer_pending", "offer_accepted", "offer_meeting_scheduled"].includes(d.data().status));
        if (!anyOpen && lead.status === "offered") await leadRef.update({ status: "declined" });
      }
    } catch (ex) { console.log("יישוב תגובה נכשל עבור ליד " + t.leadId + ":", ex.message); }
  }
}

async function renderReferrals() {
  mainEl.innerHTML = `<h1>ההפניות שלי</h1><p class="muted">טוען...</p>`;
  await reconcileMyResponseTokens();

  // כולל גם לידים שהופצו אליי כהצעה מקבילה (גם אם בסוף עו"ד אחר פתח את התיק)
  const snap = await db.collection("leads").where("offeredLawyerEmails", "array-contains", currentLawyer.email).get();
  let leads = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  leads.sort((a, b) => (b.createdAt && a.createdAt ? b.createdAt.toMillis() - a.createdAt.toMillis() : 0));

  // שליפת ההצעה האישית שלי (מסמך נפרד) בכל ליד, ופרטי לקוח כשההצעה שלי מאושרת ומעלה
  leads = await Promise.all(leads.map(async (l) => {
    const offerDoc = await db.collection("leads").doc(l.id).collection("offers").doc(currentLawyer.email).get();
    const myOffer = offerDoc.exists ? offerDoc.data() : {};
    let extra = {};
    if (["offer_accepted", "offer_meeting_scheduled", "offer_case_opened"].includes(myOffer.status)) {
      try {
        const contactDoc = await db.collection("leads").doc(l.id).collection("private").doc("contact").get();
        if (contactDoc.exists) extra = contactDoc.data();
      } catch (e) { /* אין גישה - לא נורא, פשוט לא נציג */ }
    }
    return { ...l, myOffer, ...extra };
  }));

  const rows = leads.map((l) => {
    const myOffer = l.myOffer || {};
    let displayStatus = myOffer.status || l.status;
    let actionHtml = "";

    if (leadIsClosedByOther(l)) {
      // עו"ד אחר כבר פתח תיק בפועל על הליד הזה - גם אם אני עדיין "באמצע" (אישרתי/קבעתי פגישה), התהליך שלי נסגר
      displayStatus = "offer_closed_other_won";
      actionHtml = `<span class="muted">עו"ד אחר כבר פתח תיק על ליד זה</span>`;
    } else if (NEXT_ACTION[myOffer.status]) {
      actionHtml = `<button class="btn small" onclick="triggerAdvance('${l.id}','${NEXT_ACTION[myOffer.status].next}')">${NEXT_ACTION[myOffer.status].label}</button>
                    <button class="btn small secondary" onclick="advanceStatus('${l.id}','offer_not_realized')">לא התממש</button>`;
      if (myOffer.meetingDate) actionHtml = `<div class="muted" style="margin-bottom:4px;">פגישה: ${fmtDate(myOffer.meetingDate)}</div>` + actionHtml;
    } else if (myOffer.status === "offer_pending") {
      actionHtml = `<span class="muted">ממתינה לתגובתך - בדוק/י את תיבת המייל לקישור המענה</span>`;
    }

    return `<tr>
      <td>${l.leadNumber ? "#" + Number(l.leadNumber) : "-"}</td>
      <td>${fmtDate(l.createdAt)}</td>
      <td>${esc(l.clientName) || '<span class="muted">מוצג לאחר אישור קבלה</span>'}</td>
      <td>${esc(l.clientPhone) || "-"}</td>
      <td>${esc(l.practiceArea)}${l.region ? " · " + esc(l.region) : ""}</td>
      <td><span class="badge ${displayStatus}">${statusLabel(displayStatus)}</span></td>
      <td>${actionHtml}</td>
    </tr>`;
  }).join("");

  mainEl.innerHTML = `<h1>ההפניות שלי</h1>
    <p class="muted">שים לב: הפניה יכולה להישלח גם לעורכי דין נוספים במקביל. ברגע שמישהו מסמן "נפתח תיק" בפועל, הליד ננעל לשאר.</p>
    <div class="card" style="overflow-x:auto;"><table>
    <thead><tr><th>מס'</th><th>תאריך קבלה</th><th>שם לקוח</th><th>טלפון</th><th>תחום</th><th>סטטוס</th><th>פעולה</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="muted">עדיין לא התקבלו הפניות</td></tr>'}</tbody>
  </table></div>`;
}

// מעבר ל"נקבעה פגישה" דורש קודם תאריך פגישה - מציג טופס קטן ורק אז קורא ל-advanceStatus
function triggerAdvance(leadId, newOfferStatus) {
  if (newOfferStatus !== "offer_meeting_scheduled") return advanceStatus(leadId, newOfferStatus);
  openModal(`
    <h2>תאריך הפגישה</h2>
    <form id="meetingDateForm">
      <label>מתי נקבעה הפגישה עם הלקוח?</label>
      <input type="date" id="meetingDateInput" required>
      <div class="error-msg" id="err"></div>
      <div style="display:flex; gap:10px; margin-top:18px;"><button class="btn" type="submit">אישור</button><button class="btn secondary" type="button" onclick="closeModal()">ביטול</button></div>
    </form>`);
  document.getElementById("meetingDateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const dateVal = document.getElementById("meetingDateInput").value;
    closeModal();
    await advanceStatus(leadId, newOfferStatus, { meetingDate: firebase.firestore.Timestamp.fromDate(new Date(dateVal)) });
  });
}

async function advanceStatus(leadId, newOfferStatus, extra = {}) {
  try {
    const leadRef = db.collection("leads").doc(leadId);
    const myOfferRef = leadRef.collection("offers").doc(currentLawyer.email);
    const [leadDoc, myOfferDoc] = await Promise.all([leadRef.get(), myOfferRef.get()]);
    const lead = leadDoc.data();
    if (!myOfferDoc.exists) { alert("שגיאה: לא נמצאה הצעה עבורך בליד זה."); return; }
    const myOffer = myOfferDoc.data();
    if (lead.status === "case_opened") { alert('עו"ד אחר כבר פתח תיק על ליד זה.'); renderReferrals(); return; }

    await myOfferRef.update({ ...extra, status: newOfferStatus, respondedAt: myOffer.respondedAt || firebase.firestore.FieldValue.serverTimestamp() });

    if (newOfferStatus === "offer_case_opened") {
      // אני הראשון שפתח תיק בפועל - נועל את הליד, וסוגר את ההצעות הפתוחות של שאר עורכי הדין
      await leadRef.update({ status: "case_opened", assignedLawyerEmail: currentLawyer.email, caseOpenedAt: firebase.firestore.FieldValue.serverTimestamp() });
      const siblingsSnap = await leadRef.collection("offers").get();
      const closeBatch = db.batch();
      let anyClose = false;
      siblingsSnap.docs.forEach((d) => {
        const o = d.data();
        if (d.id !== currentLawyer.email && ["offer_pending", "offer_accepted", "offer_meeting_scheduled"].includes(o.status)) {
          closeBatch.update(d.ref, { status: "offer_closed_other_won" });
          anyClose = true;
        }
      });
      if (anyClose) await closeBatch.commit();
    }

    await db.collection("statusLogs").add({
      leadId, fromStatus: myOffer.status, toStatus: newOfferStatus, actor: "lawyer", lawyerEmail: currentLawyer.email,
      at: firebase.firestore.FieldValue.serverTimestamp(),
    });

    if (newOfferStatus === "offer_case_opened") {
      await db.collection("cases").add({
        leadId, lawyerEmail: currentLawyer.email, openedAt: firebase.firestore.FieldValue.serverTimestamp(),
        feeAgreed: null, collectionStatus: "not_collected", amountPaid: 0, notes: "",
      });
    }
    renderReferrals();
  } catch (ex) { alert("שגיאה: " + ex.message); }
}

      <label>עדכון סטטוס גבייה</label>
      <select id="mmLawyerCs">
        <option value="">-</option>
        ${mmMasterData.collectionStatuses.map((s) => `<option value="${esc(s)}" ${f.collectionStatus === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
      </select>
      <button class="btn small secondary" type="submit" style="margin-top:8px;">עדכון</button>
    </form>
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <label>סגירת התיק</label>
      <select id="mmLawyerCr"><option value="">בחר/י סיבת סגירה...</option>${mmMasterData.closureReasons.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select>
      <button class="btn danger small" style="margin-top:8px;" onclick="closeMyMmFile('${id}')">סגירת תיק</button>
    </div>` : `<p class="muted">התיק סגור. סיבה: ${esc(f.closureReason) || "-"}</p>`}
    <h3 style="margin-top:20px;">יומן מגעים</h3>
    <table><thead><tr><th>תאריך</th><th>הערה</th></tr></thead><tbody>${logRows}</tbody></table>
    <div style="margin-top:16px;"><button class="btn secondary" onclick="closeModal()">סגירה</button></div>`);

  const addForm = document.getElementById("addContactForm");
  if (addForm) addForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    await db.collection("mmFiles").doc(id).collection("contactLog").add({

async function closeMyMmFile(id) {
  const reason = document.getElementById("mmLawyerCr").value;
  if (!reason) { alert("יש לבחור סיבת סגירה."); return; }
  if (!confirm("לסגור את התיק?")) return;
  await db.collection("mmFiles").doc(id).update({ status: "mm_closed", closureReason: reason, closedAt: firebase.firestore.FieldValue.serverTimestamp() });
  openMmFileActions(id);
}

function downloadMyCasesCsv() {
  const cases = window._myCasesData || [];
  const rows = [["נפתח בתאריך", "שכ\"ט שסוכם", "סטטוס גבייה", "שולם בפועל"]];
  cases.forEach((c) => rows.push([fmtDate(c.openedAt), c.feeAgreed ?? "", statusLabel(c.collectionStatus), c.amountPaid || 0]));
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `התיקים-שלי-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

  const subject = encodeURIComponent(`פנייה ממערכת שת"פ - מעו"ד ${currentLawyer.fullName}`);
  const mailtoLink = `mailto:${ADMIN_CONTACT_EMAIL}?subject=${subject}`;

  const contactLine = currentLawyer.lawyerType === "mm_file"
    ? `<p class="muted" style="margin-top:16px;">לכל שאלה יש ליצור קשר עם עו"ד דנית מזור</p>`
    : `<p class="muted" style="margin-top:16px;">לשאלות ופניות בוואטסאפ: <a href="https://wa.me/972557150826" target="_blank">055-7150826</a></p>`;

  mainEl.innerHTML = `
    <h1>יצירת קשר עם המשרד</h1>
    <div class="card" style="max-width:480px;">
      <p class="muted">לחיצה על הכפתור תפתח הודעת מייל חדשה בתוכנת המייל שלך, מוכנה לשליחה למשרד.</p>
      <a class="btn" href="${mailtoLink}" style="display:inline-block; text-decoration:none; text-align:center;">פתיחת מייל חדש למשרד</a>
      ${contactLine}
    </div>`;
}

async function render(view) {
  try {
    if (view === "referrals") await renderReferrals();
    else if (view === "cases") await renderCases();
    else if (view === "mmfiles") await renderMmFiles();
    else if (view === "contact") await renderContact();
    else if (view === "terms") renderTerms();
    else if (view === "account") await renderAccount();
  } catch (ex) { mainEl.innerHTML = `<p class="error-msg">${ex.message}</p>`; }
}

requireLawyer((user, lawyerDoc) => {
  currentLawyer = { email: user.email, ...lawyerDoc };
  if (currentLawyer.lawyerType === "mm_file") {
    document.querySelectorAll("#nav a[data-referral-only]").forEach((a) => a.style.display = "none");
    document.querySelector('#nav a[data-mm-only]').style.display = "";
    document.getElementById("sidebarContactLine").textContent = 'לכל שאלה יש ליצור קשר עם עו"ד דנית מזור';
    document.querySelectorAll("#nav a").forEach((a) => a.classList.remove("active"));
    document.querySelector('#nav a[data-view="mmfiles"]').classList.add("active");
    render("mmfiles");
  } else {
    render("referrals");
  }
});
  </script>
</body>
</html>
