<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת הפניות בין עורכי דין</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500&display=swap');
body{margin:0;background:#F6F4EF;color:#23292B;font-family:'Heebo',sans-serif;direction:rtl;}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{width:400px;max-width:90vw;background:#fff;border:1px solid #E2DED4;border-radius:6px;padding:34px 30px;text-align:center;}
.brand{font-family:'Frank Ruhl Libre',serif;font-size:1.3rem;color:#1F3A3D;margin-bottom:4px;}
.muted{color:#5B635F;font-size:.9rem;}
.btn{display:block;background:#1F3A3D;color:#fff;border:none;padding:11px 18px;border-radius:6px;font-size:.95rem;text-decoration:none;margin-top:10px;}
.btn.secondary{background:transparent;color:#1F3A3D;border:1px solid #E2DED4;}
</style>
</head>
<body>
  <div class="auth-screen">
    <div class="box">
      <div class="brand">מערכת הפניות</div>
      <p class="muted">ניהול הפניות ותיקים בין המשרד לעורכי דין שותפים</p>
      <a class="btn" href="admin-login.html">כניסת מנהל</a>
      <a class="btn secondary" href="lawyer-login.html">כניסת עו"ד</a>
    </div>
  </div>
</body>
</html>
